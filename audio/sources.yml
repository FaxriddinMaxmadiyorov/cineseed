sfx:
  boom:
    - { id: boom_heavy, pkg: freeorion-data, file: combat/explosion-heavy1.ogg }
    - { id: boom_nuke, pkg: btanks-data, file: nuke-explosion.ogg }
    - { id: boom_building, pkg: btanks-data, file: building-explosion1.ogg }
    - { id: boom_med, pkg: freeorion-data, file: combat/explosion-med1.ogg }
    - { id: boom_doom, pkg: angband-audio, file: amb_door_doom.ogg }
  hit:
    - { id: hit_heavy, pkg: lugaru-data, file: HeavyImpact.ogg }
    - { id: hit_anvil, pkg: angband-audio, file: plc_hit_anvil2.ogg }
    - { id: hit_metal, pkg: lugaru-data, file: MetalHit.ogg }
    - { id: hit_slam, pkg: angband-audio, file: plm_door_slam.ogg }
    - { id: hit_crash, pkg: crossfire-client, file: MetalCrash.wav }
  gong:
    - { id: gong_low, pkg: angband-audio, file: amb_gong_low.ogg }
    - { id: gong_strike, pkg: angband-audio, file: amb_gong_strike.ogg }
    - { id: gong_temple, pkg: angband-audio, file: sum_gong_temple.ogg }
    - { id: gong_bright, pkg: crossfire-client, file: gong.wav }
  whoosh:
    - { id: whoosh_long, pkg: lugaru-data, file: Whoosh.ogg }
    - { id: whoosh_short, pkg: crossfire-client, file: Whoosh.wav }
    - { id: whoosh_low, pkg: lugaru-data, file: LowWhoosh.ogg }
    - { id: whoosh_mid, pkg: lugaru-data, file: MidWhoosh.ogg }
  thunder:
    - { id: thunder_roll, pkg: angband-audio, file: amb_thunder_roll.ogg }
    - { id: thunder_rain, pkg: angband-audio, file: amb_thunder_rain.ogg }
    - { id: thunder_crack, pkg: flare-game, file: soundfx/powers/thunder.ogg }
  heartbeat:
    - { id: heartbeat, pkg: flare-game, file: soundfx/heartbeat.ogg }
  tick:
    - { id: tower_clock, pkg: crossfire-client, file: TowerClock.wav }
    - { id: mine_tick, pkg: btanks-data, file: mine-tick.ogg }
  creak:
    - { id: door_creak, pkg: angband-audio, file: plm_door_creak.ogg }
    - { id: floor_creak, pkg: angband-audio, file: plm_floor_creak.ogg }
  glass:
    - { id: glass_break, pkg: angband-audio, file: plm_break_glass.ogg }
  laser:
    - { id: laser, pkg: freeorion-data, file: combat/laser-blaster2.ogg }
  bell:
    - { id: bell_tibet, pkg: angband-audio, file: amb_bell_tibet1.ogg }
    - { id: bell_bowl, pkg: angband-audio, file: pls_bell_bowl.ogg }
  toon:
    - { id: toon_fall, pkg: warmux-data, file: sound/default/weapons/anvil_fall.ogg }
    - { id: toon_bounce, pkg: warmux-data, file: sound/default/weapons/gnu_bounce.ogg }
    - { id: toon_slap, pkg: warmux-data, file: sound/default/weapons/slap.ogg }
  growl:
    - { id: growl, pkg: lugaru-data, file: Growl.ogg }
  wind:
    - { id: wind, pkg: flare-game, file: soundfx/environment/wind_loop.ogg, trim: 12 }
  riser:
    # reversed recordings: a classic trailer "suck-in" before a hit
    - { id: riser_gong, pkg: angband-audio, file: amb_gong_undertone.ogg, reverse: true, trim: 4 }
    - { id: riser_thunder, pkg: angband-audio, file: amb_thunder_roll.ogg, reverse: true, trim: 4 }
    - { id: riser_boom, pkg: freeorion-data, file: combat/explosion-heavy1.ogg, reverse: true, trim: 3 }
