# Music and sound effects for trailers.
#
# Every file comes from a free/open game data package in the Debian/Ubuntu archive. The builder
# (script/build_audio_library.py) downloads the packages with `apt-get download`, extracts the
# listed files, analyses tempo/beats/energy with librosa, cuts the strongest windows into short
# excerpts, normalizes loudness with ffmpeg and writes audio/manifest.json.
#
# moods drive the choice per genre (see config/trailer/genres.yml).

packages:
  wesnoth-1.16-music: { license: GPL-2.0-or-later, attribution: "The Battle for Wesnoth soundtrack (various composers)", root: usr/share/games/wesnoth/1.16/data/core/music }
  flare-game: { license: CC-BY-SA-3.0, attribution: "Flare: Empyrean Campaign soundtrack and sounds", root: usr/share/games/flare/mods/fantasycore }
  warmux-data: { license: GPL-2.0-or-later, attribution: "Warmux soundtrack and sounds (Olivier Militon, Mike Errecart and others)", root: usr/share/games/warmux }
  singularity-music: { license: CC-BY-SA-3.0, attribution: "Singularity soundtrack", root: usr/share/games/singularity/music }
  starfighter-data: { license: CC-BY-3.0 / CC-BY-SA-3.0, attribution: "Project: Starfighter soundtrack", root: usr/share/starfighter/music }
  hyperrogue-music: { license: CC-BY-SA-3.0, attribution: "HyperRogue soundtrack (Shawn Parrotte, Lincoln Domina, Rafal Wesolowski)", root: usr/share/hyperrogue/music }
  warzone2100-music: { license: GPL-2.0-or-later, attribution: "Warzone 2100 soundtrack", root: usr/share/games/warzone2100/music }
  freeorion-data: { license: CC-BY-SA-3.0, attribution: "FreeOrion sound effects", root: usr/share/games/freeorion/default/data/sound }
  angband-audio: { license: CC-BY-NC-SA-3.0, attribution: "Angband sound effects (Myshkin and contributors)", root: usr/share/angband/sounds }
  lugaru-data: { license: CC-BY-SA-3.0, attribution: "Lugaru sound effects (Wolfire Games)", root: usr/share/games/lugaru/Sounds }
  btanks-data: { license: GPL-2.0-or-later, attribution: "Battle Tanks sound effects", root: usr/share/games/btanks/data/sounds }
  crossfire-client: { license: GPL-2.0-or-later / CC-BY-3.0, attribution: "Crossfire client sounds", root: usr/share/games/crossfire-client/sounds }
  brainparty-data: { license: GPL-3.0-or-later, attribution: "Brain Party sounds", root: usr/share/games/brainparty }

