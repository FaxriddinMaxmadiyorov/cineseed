      taglines:
        action:
          - "No rules. No backup. No second chances."
          - "The clock started the moment she said no."
          - "Some missions don't come with a way home."
          - "He wanted one quiet year. The world had other plans."
          - "Every road out of town is already burning."
          - "The last job is always the one that goes wrong."
        adventure:
          - "The map ends here. They don't."
          - "Every legend begins with someone foolish enough to try."
          - "Beyond the last river lies the first wonder."
          - "Pack light. Trust no one. Keep walking."
          - "The world is bigger than the stories told about it."
          - "Some treasures are guarded by more than locks."
        animation:
          - "Small hero. Huge problem."
          - "Every forest has a secret. This one has a hundred."
          - "Friendship has never been this fluffy."
          - "One wish. Zero instructions."
          - "The bravest adventures start in the backyard."
          - "Even legends have to start somewhere."
        comedy:
          - "What could possibly go wrong? Everything. Twice."
          - "They had one job. They did not do that job."
          - "Family is forever. Unfortunately."
          - "A perfect plan, executed by imperfect people."
          - "Love is patient. Love is kind. Love is very, very loud."
          - "The weekend that ruined everyone's life. Hilariously."
        crime:
          - "Everyone in this town owes somebody."
          - "The truth has a price. She's buying."
          - "Every confession has a second version."
          - "Crime pays. Until it sends the bill."
          - "One bag of money. Five people who want it."
          - "Some debts are paid in more than cash."
        documentary:
          - "The planet is still writing its own story."
          - "Three years. Five continents. One fragile miracle."
          - "The most extraordinary journeys are real."
          - "What happens when no one is watching."
          - "A portrait of the people who refused to give up."
          - "Nature never stops performing. Few ever see it."
        drama:
          - "Some goodbyes take a lifetime."
          - "She came home to bury a secret. It wasn't dead yet."
          - "Every family has a story it never tells."
          - "The hardest distance is the one between two hearts."
          - "One summer can change the rest of your life."
          - "You don't get to choose what you inherit."
        family:
          - "Home is wherever your people are. Even the furry ones."
          - "Adventure is just a bad idea with good friends."
          - "Grab a blanket. The story is about to begin."
          - "Big dreams fit in small pockets."
          - "Every family has a hero nobody expected."
          - "The holidays will never be quiet again."
        fantasy:
          - "Magic has a memory. And it remembers everything."
          - "The old gods are waking. They are not pleased."
          - "Every kingdom falls. Hers will fall upward."
          - "A crown of ash. A heart of fire."
          - "Beyond the mist, the forgotten world is waiting."
          - "Destiny doesn't knock. It breaks the door."
        horror:
          - "Some doors should stay closed."
          - "It knows where you sleep."
          - "Fear has a new address."
          - "The house remembers every scream."
          - "Don't turn around. It's already there."
          - "The dark was never empty."
        mystery:
          - "Every clue leads back to her."
          - "Nothing in this town is what it seems."
          - "The truth was buried. The past dug it up."
          - "One question nobody wants answered."
          - "The last page is missing for a reason."
          - "Seven suspects. One very patient lie."
        romance:
          - "Some people are worth missing the last train for."
          - "Love never arrives on schedule."
          - "Two hearts. One terrible sense of timing."
          - "Fall slowly. Then all at once."
          - "Every love story is a little bit of a mess."
          - "Summer ends. Some feelings don't."
        sci_fi:
          - "The future is already listening."
          - "In deep space, no one hears you hesitate."
          - "Humanity sent a message. Something answered."
          - "Tomorrow was cancelled. Today is all that's left."
          - "The signal came from inside the station."
          - "Evolution never asked for permission."
        thriller:
          - "Trust no one. Especially yourself."
          - "Forty-eight hours. One chance to disappear."
          - "The perfect alibi has a fatal flaw."
          - "Someone is always watching. Tonight, it's personal."
          - "Every secret has an expiration date."
          - "The quietest people make the loudest mistakes."
        war:
          - "Courage is a choice made under fire."
          - "They held the line so others could come home."
          - "No one returns from the front the same."
          - "History remembers the battle. They remember the names."
          - "In the silence between shots, a promise was made."
          - "The war ended. Their fight did not."
        western:
          - "The frontier has no law but the one you carry."
          - "One town. One sheriff. Too many bullets."
          - "Out here, dust settles. Scores don't."
          - "Ride hard. Shoot straight. Never look back."
          - "Every outlaw was somebody's son."
          - "The gold is in the hills. So are the graves."

      reviews:
        openers:
          positive:
            - "{title} is a genuine surprise."
            - "I walked in with low expectations and walked out grinning."
            - "Easily one of the most confident films I've seen this year."
            - "This is the kind of {genre_lower} movie people will rewatch for years."
            - "From the first frame, {title} knows exactly what it wants to be."
            - "A rare film that respects its audience."
            - "I didn't expect to care this much, but here we are."
            - "{director} has finally made the movie we always knew was coming."
          mixed:
            - "{title} has big ideas and a slightly smaller budget for them."
            - "There's a great movie somewhere inside {title}."
            - "Uneven, but never boring."
            - "I liked it more than I expected and less than I wanted."
            - "Half brilliant, half baffling."
            - "{title} is worth watching, with a few caveats."
          negative:
            - "I really wanted to like {title}."
            - "Two hours I will not be getting back."
            - "Somewhere along the way, {title} forgot what it was about."
            - "This one tries very hard and lands very little."
            - "A film that confuses being loud with being exciting."
            - "Even a strong cast can't rescue this script."
        lines:
          positive:
            - "{actor} gives a performance that sneaks up on you and doesn't let go."
            - "The pacing is tight and the final act genuinely earns its emotions."
            - "{director} directs with real patience, letting scenes breathe."
            - "The cinematography alone is worth the ticket."
            - "{actor} and {actor2} have chemistry you can't fake."
            - "The score does a lot of heavy lifting in the best possible way."
            - "Every supporting character feels like they have a life off-screen."
            - "The dialogue is sharp without ever trying to be clever."
            - "It looks fantastic, especially on a big screen."
            - "I was still thinking about the ending on the drive home."
          mixed:
            - "{actor} is excellent, but the script gives them very little to do."
            - "The middle section drags, though the ending mostly makes up for it."
            - "Some scenes are stunning; others feel like they belong to a different film."
            - "The tone wobbles between serious and silly more than it should."
            - "{director} clearly had a vision, but the edit feels rushed."
            - "It's predictable, but it's predictable in a comfortable way."
            - "The visuals are great; the dialogue is not."
          negative:
            - "{actor} does their best with lines that would sink anyone."
            - "The plot holes are big enough to drive a truck through."
            - "Every twist is visible from a mile away."
            - "The editing is so frantic it's hard to follow the action."
            - "The runtime could lose half an hour without losing anything."
            - "I never believed a single decision these characters made."
            - "Even the soundtrack seems bored."
        genre_lines:
          horror:
            positive: ["The scares are earned, not cheap.", "I watched the last twenty minutes through my fingers."]
            negative: ["Every jump scare is announced by the music ten seconds early."]
          comedy:
            positive: ["The jokes land, and the quiet moments land even harder.", "I laughed out loud more than once, which almost never happens."]
            negative: ["Most of the jokes were already in the trailer."]
          action:
            positive: ["The action is clear, brutal and beautifully staged.", "The car chase in the second act is worth the price of admission."]
            negative: ["The fights are shot so close you can't tell who is hitting whom."]
          romance:
            positive: ["It made me believe in grand gestures again.", "Sweet without ever becoming sugary."]
            negative: ["The leads have all the chemistry of two parked cars."]
          sci_fi:
            positive: ["The world-building is thoughtful and refreshingly original.", "It asks big questions and trusts you to answer them."]
