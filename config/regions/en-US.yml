# English (United States) dataset.
#
# Everything a generated movie says in this region comes from this file. People's names, cities and
# usernames come from Faker's own "en" data (I18n falls back from en-US to en); the vocabulary below
# is loaded into the same I18n tree under faker.movie_store and read through Faker::MovieStore.
#
# Title grammar (see TitleComposer):
#   {noun:x}      pick a noun into variable x (singular)   {nouns:x}   ... plural
#   {noun:x.gen}  another case of x (not used in English)  {adj@x}     adjective agreeing with x
#   {pick:list}   random entry of title.lists.list         {base}      a nested base title
#   {faker:Name.first_name}  value from Faker
en-US:
  cineseed:
    region:
      name: "English (United States)"
      short: "EN-US"
      script: latin
      order: 1

  faker:
    movie_store:
      genres:
        action: Action
        adventure: Adventure
        animation: Animation
        comedy: Comedy
        crime: Crime
        documentary: Documentary
        drama: Drama
        family: Family
        fantasy: Fantasy
        horror: Horror
        mystery: Mystery
        romance: Romance
        sci_fi: Sci-Fi
        thriller: Thriller
        war: War
        western: Western

      kinds:
        movie: Movie
        series: Series

      # Patterns for reviewer and liker usernames ({first} {last} {f} {l} {nn} {yy}); names are
      # transliterated with i18n.transliterate.rule below.
      usernames: ["{first}.{last}", "{first}_{last}", "{first}{last}", "{f}{last}", "{first}{nn}", "{last}{yy}", "{first}_{yy}", "{last}.{first}", "the_{last}", "{first}{last}{nn}", "{first}_watches", "reel_{first}"]

      runtime: "%{h}h %{m}m"
      runtime_minutes: "%{m} min"
      seasons:
        one: "%{count} season"
        other: "%{count} seasons"
      season_line: "Season %{n} · %{year} · %{episodes} episodes"

      ratings:
        G: "General audiences"
        PG: "Parental guidance suggested"
        PG-13: "Parents strongly cautioned"
        R: "Restricted"
        TV-14: "Parents strongly cautioned"
        TV-MA: "Mature audiences only"
      rating_by_genre:
        movie:
          default: { PG-13: 5, R: 3, PG: 2 }
          family: { G: 4, PG: 6 }
          animation: { G: 4, PG: 6 }
          horror: { R: 8, PG-13: 2 }
          war: { R: 6, PG-13: 4 }
          crime: { R: 6, PG-13: 4 }
          documentary: { PG: 5, G: 3, PG-13: 2 }
          comedy: { PG-13: 6, PG: 3, R: 2 }
        series:
          default: { TV-14: 6, TV-MA: 4 }
          family: { TV-14: 1, PG: 6, G: 3 }
          animation: { PG: 6, TV-14: 3 }

      title:
        case: words
        small_words: [a, an, the, of, in, on, at, to, for, and, but, or, from, with, by, into, over, as, vs]
        # Faker first names that read as countries or states in a title ("Crossing Israel") are re-drawn
        avoid: [Chad, Israel, Jordan, Argentina, China, Dominica, France, Georgia, India, Kenya, Florida, Maryland, Nevada, Virginia]
        patterns:
          - { w: 10, base: true, t: "The {adj@x} {noun:x}" }
          - { w: 6, base: true, t: "{adj@x} {noun:x}" }
          - { w: 5, base: true, t: "The {noun:x} of {noun:y}" }
          - { w: 3, base: true, t: "The {noun:x} of the {adj@y} {noun:y}" }
          - { w: 4, base: true, t: "{nouns:x} of the {adj@y} {noun:y}" }
          - { w: 3, base: true, t: "{adj@x} {nouns:x}" }
          - { w: 3, base: true, t: "The {noun:x}" }
          - { w: 6, base: true, t: "{pick:single}" }
          - { w: 6, t: "{pick:phrase}" }
          - { w: 4, t: "{pick:gerund} {nouns:x}" }
          - { w: 2, t: "{pick:gerund} {faker:Name.first_name}" }
          - { w: 3, t: "{faker:Name.first_name}'s {noun:x}" }
          - { w: 2, t: "{faker:Name.first_name} and the {adj@x} {noun:x}" }
          - { w: 2, t: "The {faker:Name.last_name} {pick:family_noun}" }
          - { w: 4, t: "{pick:city_frame}" }
          - { w: 2, t: "{pick:number} {nouns:x}" }
          - { w: 1, t: "{noun:x} & {noun:y}" }
          - { w: 4, t: "{base}: {pick:subtitle}" }
          - { w: 3, t: "{base} {pick:sequel}" }

