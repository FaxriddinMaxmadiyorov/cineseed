          - "Жодних правил. Жодного прикриття. Жодного другого шансу."
          - "Відлік почався тієї миті, коли вона сказала «ні»."
          - "Деякі місії не передбачають дороги додому."
          - "Він хотів спокійного року. Світ вирішив інакше."
          - "Кожна дорога з міста вже палає."
          - "Остання справа завжди йде не за планом."
        adventure:
          - "Мапа закінчується тут. Їхня подорож — ні."
          - "Кожна легенда починається з того, хто наважився."
          - "За останньою рікою чекає перше диво."
          - "Легкий наплічник. Нікому не вір. Іди далі."
          - "Світ більший за всі історії про нього."
          - "Деякі скарби охороняють не лише замки."
        animation:
          - "Маленький герой. Величезна проблема."
          - "У кожному лісі є таємниця. У цьому — сотня."
          - "Дружба ще ніколи не була такою пухнастою."
          - "Одне бажання. Нуль інструкцій."
          - "Найсміливіші пригоди починаються на власному подвір'ї."
          - "Навіть легенди колись були маленькими."
        comedy:
          - "Що може піти не так? Усе. Двічі."
          - "У них було одне завдання. Вони його провалили."
          - "Родина — це назавжди. На жаль."
          - "Ідеальний план у руках неідеальних людей."
          - "Кохання терпляче. Кохання лагідне. Кохання дуже, дуже гучне."
          - "Вихідні, які зіпсували всім життя. Неймовірно смішно."
        crime:
          - "У цьому місті кожен комусь винен."
          - "Правда має ціну. Вона готова платити."
          - "Кожне зізнання має другу версію."
          - "Злочин окуповується. Доки не прийде рахунок."
          - "Одна сумка грошей. П'ятеро, хто її хоче."
          - "Деякі борги не повертають грошима."
        documentary:
          - "Планета й досі пише власну історію."
          - "Три роки. П'ять континентів. Одне крихке диво."
          - "Найдивовижніші подорожі — справжні."
          - "Що відбувається, коли ніхто не дивиться."
          - "Портрет людей, які не здалися."
          - "Природа ніколи не зупиняє вистави. Але бачать її небагато."
        drama:
          - "Деякі прощання тривають усе життя."
          - "Вона повернулася додому, щоб поховати таємницю. Та ще жива."
          - "У кожної родини є історія, яку не розповідають."
          - "Найдовша відстань — між двома серцями."
          - "Одне літо може змінити все подальше життя."
          - "Спадок не обирають."
        family:
          - "Дім там, де твої рідні. Навіть пухнасті."
          - "Пригода — це погана ідея з хорошими друзями."
          - "Беріть ковдру. Історія починається."
          - "Великі мрії вміщаються в маленьких кишенях."
          - "У кожній родині є герой, на якого ніхто не чекав."
          - "Свята вже ніколи не будуть тихими."
        fantasy:
          - "Магія пам'ятає все."
          - "Старі боги прокидаються. І вони не в захваті."
          - "Кожне королівство падає. Її — злетить."
          - "Корона з попелу. Серце з полум'я."
          - "За туманом чекає забутий світ."
          - "Доля не стукає. Вона вибиває двері."
        horror:
          - "Деякі двері краще не відчиняти."
          - "Воно знає, де ти спиш."
          - "Страх має нову адресу."
          - "Будинок пам'ятає кожен крик."
          - "Не обертайся. Воно вже тут."
          - "Темрява ніколи не була порожньою."
        mystery:
          - "Кожен слід веде до неї."
          - "У цьому місті ніщо не є тим, чим здається."
          - "Правду поховали. Минуле її відкопало."
          - "Питання, на яке ніхто не хоче відповіді."
          - "Останньої сторінки бракує не випадково."
          - "Семеро підозрюваних. Одна дуже терпляча брехня."
        romance:
          - "Заради деяких людей не шкода пропустити останній потяг."
          - "Кохання ніколи не приходить вчасно."
          - "Два серця. Жахливий збіг обставин."
          - "Спершу повільно. А потім — одразу й назавжди."
          - "Кожна історія кохання — трохи хаос."
          - "Літо минає. Деякі почуття — ні."
        sci_fi:
          - "Майбутнє вже слухає."
          - "У відкритому космосі ніхто не почує твоїх вагань."
          - "Людство надіслало повідомлення. Щось відповіло."
          - "Завтра скасовано. Залишилося тільки сьогодні."
          - "Сигнал ішов зсередини станції."
          - "Еволюція ніколи не питала дозволу."
        thriller:
          - "Нікому не вір. Особливо собі."
          - "Сорок вісім годин. Один шанс зникнути."
          - "Ідеальне алібі має фатальну ваду."
          - "Хтось завжди спостерігає. Сьогодні — особисто."
          - "Кожна таємниця має термін придатності."
          - "Найтихіші люди роблять найгучніші помилки."
        war:
          - "Мужність — це вибір під обстрілом."
          - "Вони тримали оборону, щоб інші повернулися додому."
          - "З фронту ніхто не повертається таким, як був."
          - "Історія пам'ятає битву. Вони пам'ятають імена."
          - "У тиші між пострілами прозвучала обіцянка."
          - "Війна скінчилася. Їхня боротьба — ні."
        western:
          - "На кордоні діє лише той закон, що ти носиш при собі."
          - "Одне місто. Один шериф. Забагато куль."
          - "Тут пил осідає. Рахунки — ні."
          - "Скачи швидко. Стріляй влучно. Не озирайся."
          - "Кожен вигнанець колись був чиїмось сином."
          - "Золото — в пагорбах. Могили — теж."

      reviews:
        openers:
          positive:
            - "«{title}» — справжній сюрприз."
            - "Прийти з низькими очікуваннями й вийти з усмішкою — рідкісний досвід."
            - "Один із найвпевненіших фільмів цього року."
            - "З першого кадру фільм «{title}» точно знає, чим хоче бути."
            - "Рідкісний фільм, який поважає глядача."
            - "Не думалося, що це так зачепить."
            - "{director} нарешті створює фільм, на який ми всі чекали."
          mixed:
            - "У фільмі «{title}» великі ідеї та трохи менший бюджет на них."
            - "Десь усередині фільму «{title}» ховається чудове кіно."
            - "Нерівно, але ніколи не нудно."
            - "Краще, ніж очікувалося, але слабше, ніж хотілося."
            - "Наполовину геніально, наполовину дивно."
            - "Варто подивитися, хоча з певними застереженнями."
          negative:
            - "Дуже хотілося, щоб фільм «{title}» сподобався."
            - "Дві години, які я вже не поверну."
            - "Десь посередині фільм «{title}» забуває, про що він."
            - "Фільм дуже старається, але майже ніколи не влучає."
            - "Фільм, який плутає гучність із напругою."
            - "Навіть сильний акторський склад не рятує цей сценарій."
        lines:
          positive:
            - "{actor} грає так, що це не відпускає ще довго."
            - "Темп бездоганний, а фінал чесно заробляє кожну сльозу."
            - "Режисура терпляча: сценам дають подихати."
            - "Лише операторська робота вартує квитка."
            - "{actor} і {actor2} мають справжню хімію, яку неможливо зіграти."
            - "Музика підсилює фільм саме там, де треба."
            - "Навіть другорядні персонажі живуть власним життям."
            - "Діалоги гострі, але без самолюбування."
            - "На великому екрані це виглядає фантастично."
            - "Про фінал думається ще всю дорогу додому."
          mixed:
            - "{actor} — окраса фільму, але сценарій дає замало матеріалу."
            - "Середина провисає, хоча фінал багато що виправляє."
            - "Деякі сцени вражають, інші ніби з іншого фільму."
            - "Тон хитається між серйозним і безглуздим частіше, ніж слід."
            - "У режисера була візія, але монтаж поспішний."
            - "Передбачувано, але по-затишному."
            - "Картинка сильна, а от діалоги — ні."
          negative:
            - "{actor} старається з репліками, які потопили б будь-кого."
            - "Сюжетні діри такі, що в них проїде вантажівка."
            - "Кожен поворот видно за кілометр."
            - "Монтаж настільки хаотичний, що за екшеном важко стежити."
            - "Фільм нічого не втратив би без зайвих пів години."
            - "Жодне рішення героїв мене не переконало."
            - "Навіть саундтрек звучить знуджено."
        genre_lines:
          horror:
            positive: ["Страх тут заслужений, а не дешевий.", "Останні двадцять хвилин доводилося дивитися крізь пальці."]
            negative: ["Кожен скример музика оголошує секунд за десять."]
          comedy:
            positive: ["Жарти влучають, а тихі моменти — ще більше.", "Кілька разів уся зала сміялася вголос, а це рідкість."]
            negative: ["Більшість жартів уже були в трейлері."]
          action:
            positive: ["Екшен чіткий, жорсткий і чудово поставлений.", "Сама лише погоня в другому акті вартує квитка."]
            negative: ["Бійки зняті так близько, що не розбереш, хто кого б'є."]
          romance:
            positive: ["Після нього знову віриш у великі жести.", "Романтично, але без цукру."]
            negative: ["Між головними героями хімії, як між двома припаркованими авто."]
          sci_fi:
            positive: ["Світ продуманий і приємно оригінальний.", "Фільм ставить великі питання й довіряє нам відповіді."]
            negative: ["Наука тут — нісенітниця, і зовсім не весела."]
          documentary:
            positive: ["Кадри неймовірні, а історія за ними — ще більше.", "Розповідає, не повчаючи."]
            negative: ["Більше схоже на довгу заставку, ніж на документалку."]
          family:
            positive: ["Діти в захваті, і, чесно кажучи, я теж.", "Смішно для дітей і несподівано зворушливо для батьків."]
            negative: ["Задовго для малечі й надто просто для всіх інших."]
          animation:
            positive: ["Кожен кадр ніби зроблений вручну з любов'ю.", "Анімація чудова й повна дрібних деталей."]
            negative: ["Гарно на вигляд, але швидко забувається."]
          western:
            positive: ["Запилений, жорсткий і гарний — таким і має бути вестерн."]
            negative: ["Багато капелюхів, мало справи."]
          war:
            positive: ["Болісно, людяно й незабутньо."]
            negative: ["Трагедія тут лише тло для вибухів."]
          thriller:
            positive: ["Напруга не спадає ані на секунду."]
            negative: ["Головний поворот руйнує все, що було до нього."]
        closers:
          positive:
            - "Однозначно рекомендую."
            - "Дивіться на найбільшому екрані, який знайдете."
            - "{rating}/10, і це ще скромна оцінка."
            - "Одразу до улюблених."
            - "Візьміть хустинки."
          mixed:
            - "Згодиться для лінивої неділі."
            - "Краще дочекатися стрімінгу."
            - "{rating}/10. Добре, але не чудово."
            - "На любителя."
          negative:
            - "Можна пропустити."
            - "{rating}/10, переважно за старання."
            - "Краще перегляньте трейлер: той самий фільм, тільки коротший."
            - "Не рекомендую."
        # Reviews of series talk about episodes and seasons instead of the cinema.
        series:
          openers:
            positive:
              - "«{title}» — рідкісний серіал, який стає кращим із кожною серією."
              - "Планувалася одна серія, а скінчилося цілим сезоном до ранку."
              - "Цей серіал я зараз раджу всім знайомим."
              - "Уже з першої серії «{title}» точно знає, куди веде історію."
              - "Мало який серіал так довіряє глядачеві."
            mixed:
              - "У «{title}» сильна перша половина сезону і хитка друга."
              - "Десь усередині «{title}» ховається чудовий серіал."
              - "Від серії до серії нерівно, але ніколи не нудно."
              - "Одні серії злітають, інші просто заповнюють ефір."
              - "«{title}» вартий уваги, хоч і з застереженнями."
            negative:
              - "Три серії «{title}», і досить. Це було щедро."
              - "Цілий сезон, який міг би бути півторагодинним фільмом."
              - "Десь посередині сезону «{title}» губить нитку."
              - "Серіал дуже старається, але мало чого досягає."
              - "Навіть сильний акторський склад не рятує цей серіал."
          lines:
            positive:
              - "{actor} із кожною серією дедалі глибше вживається в роль."
              - "Сценаристи точно знають, коли обірвати серію на найцікавішому."
              - "{actor} і {actor2} разом дарують одні з найкращих сцен цього року."
              - "Кожна серія рухає історію вперед, нічого зайвого."
              - "Фінал сезону зв'язує всі нитки без жодних хитрощів."
              - "Другорядні персонажі отримують справжній розвиток."
              - "Повільний початок окупається вже з третьої серії."
              - "{director} надає серіалу вигляду, який на телебаченні трапляється рідко."
            mixed:
              - "{actor} чудово грає, але побічні сюжетні лінії ведуть у нікуди."
              - "Середні серії затягнуті, хоча фінал багато що виправляє."
              - "Одні сюжетні лінії захоплюють, інші явно розтягнуті."
              - "Тон стрибає від серії до серії сильніше, ніж слід."
              - "Передбачувано, але затишно: такий серіал легко подивитися за вихідні."
              - "Чудові персонажі, нерівні сценарії."
            negative:
              - "{actor} щосили бореться з репліками, які потопили б будь-кого."
              - "Кожен кліфгенгер розв'язують у перші дві хвилини наступної серії."
              - "Половину сезону сюжет ходить по колу."
              - "Забагато персонажів і замало причин ними перейматися."
              - "Фінал руйнує ту крихту прихильності, яку сезон устиг заробити."
              - "Серії зливаються в одну."
          closers:
