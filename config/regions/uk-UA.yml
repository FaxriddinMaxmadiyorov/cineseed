# Ukrainian (Ukraine) dataset. Names, cities and usernames come from Faker's "uk" data
# (I18n falls back from uk-UA to uk). Adjectives are stems with a hard or soft paradigm and agree
# with the noun's gender, number and case (nominative / genitive). Titles use sentence case.
uk-UA:
  # ASCII spelling of names, used for usernames (Rails I18n transliteration rules)
  i18n:
    transliterate:
      rule:
        "а": "a"
        "б": "b"
        "в": "v"
        "г": "h"
        "ґ": "g"
        "д": "d"
        "е": "e"
        "є": "ye"
        "ж": "zh"
        "з": "z"
        "и": "y"
        "і": "i"
        "ї": "yi"
        "й": "y"
        "к": "k"
        "л": "l"
        "м": "m"
        "н": "n"
        "о": "o"
        "п": "p"
        "р": "r"
        "с": "s"
        "т": "t"
        "у": "u"
        "ф": "f"
        "х": "kh"
        "ц": "ts"
        "ч": "ch"
        "ш": "sh"
        "щ": "shch"
        "ь": ""
        "ю": "yu"
        "я": "ya"
        "’": ""
        "'": ""
        "ʼ": ""

  cineseed:
    region:
      name: "Українська (Україна)"
      short: "UK-UA"
      script: cyrillic
      order: 3

  faker:
    movie_store:
      genres:
        action: Бойовик
        adventure: Пригоди
        animation: Анімація
        comedy: Комедія
        crime: Кримінал
        documentary: Документальний
        drama: Драма
        family: Сімейний
        fantasy: Фентезі
        horror: Жахи
        mystery: Детектив
        romance: Мелодрама
        sci_fi: Фантастика
        thriller: Трилер
        war: Воєнний
        western: Вестерн

      kinds:
        movie: Фільм
        series: Серіал

      # Patterns for reviewer and liker usernames ({first} {last} {f} {l} {nn} {yy}); names are
      # transliterated with i18n.transliterate.rule below.
      usernames: ["{first}.{last}", "{first}_{last}", "{first}{last}", "{f}{last}", "{first}{nn}", "{last}{yy}", "{f}.{last}", "{last}_{first}", "{first}_kino", "kinoman_{first}", "{first}{last}{nn}", "{first}_ua"]

      runtime: "%{h} год %{m} хв"
      runtime_minutes: "%{m} хв"
      seasons: "Сезонів: %{count}"
      season_line: "Сезон %{n} · %{year} · серій: %{episodes}"

      ratings:
        0+: "Для глядачів будь-якого віку"
        12+: "Для глядачів від 12 років"
        16+: "Для глядачів від 16 років"
        18+: "Тільки для дорослих"
      rating_by_genre:
        movie:
          default: { 12+: 6, 16+: 4 }
          family: { 0+: 8, 12+: 2 }
          animation: { 0+: 9, 12+: 1 }
          horror: { 16+: 4, 18+: 6 }
          war: { 16+: 7, 18+: 3 }
          crime: { 16+: 6, 18+: 4 }
          documentary: { 0+: 6, 12+: 4 }
          comedy: { 12+: 7, 16+: 3 }
        series:
          default: { 12+: 5, 16+: 5 }
          family: { 0+: 8, 12+: 2 }
          animation: { 0+: 9, 12+: 1 }

      title:
        case: first
        adjective_endings:
          hard:
            default:
              nom: { m: ий, f: а, n: е, pl: і }
              gen: { m: ого, f: ої, n: ого, pl: их }
          soft:
            default:
              nom: { m: ій, f: я, n: є, pl: і }
              gen: { m: ього, f: ьої, n: ього, pl: іх }
        # Faker city names that are drawn again: places under occupation or on the front line do not
        # belong in light entertainment titles ("Останній потяг до міста ...").
        avoid: [Алчевськ, Бахмут, Бердянськ, Горлівка, Донецьк, Євпаторія, Єнакієве, Запоріжжя, Керч, Краматорськ, Хрустальний, Лисичанськ, Луганськ, Макіївка, Маріуполь, Мелітополь, Нікополь, Севастополь, Сіверськодонецьк, Сімферополь, Слов’янськ, Слов'янськ, Харків, Херсон, Ялта]
        patterns:
          - { w: 10, base: true, t: "{adj@x} {noun:x}" }
          - { w: 3, base: true, t: "{adj@x} {nouns:x}" }
          - { w: 6, base: true, t: "{noun:x} {noun:y.gen}" }
          - { w: 6, base: true, t: "{noun:x} {adj@y.gen} {noun:y.gen}" }
          - { w: 3, base: true, t: "{noun:x} {nouns:y.gen}" }
          - { w: 2, base: true, t: "{noun:x} {adj@y.gen} {nouns:y.gen}" }
          - { w: 5, base: true, t: "{pick:single}" }
          - { w: 6, t: "{pick:phrase}" }
          - { w: 2, t: "{faker:Name.first_name} і {noun:x}" }
          - { w: 3, t: "{pick:prep_frame}" }
          - { w: 2, t: "{pick:city_frame}" }
          - { w: 4, t: "{base}: {pick:subtitle}" }
          - { w: 3, t: "{base} {pick:sequel}" }

        nouns:
          # чоловічий рід
          - { g: m, nom: вовк, gen: вовка, pl: вовки, pl_gen: вовків, tags: [horror, fantasy, western, adventure, thriller] }
