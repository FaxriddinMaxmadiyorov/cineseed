# German (Germany) dataset. Names, cities and usernames come from Faker's "de" data
# (I18n falls back from de-DE to de). Titles are built with real German declension:
# adjective stems get their endings from title.adjective_endings, articles from title.articles,
# and every noun carries its gender, genitive and plural forms.
de-DE:
  # ASCII spelling of names, used for usernames (Rails I18n transliteration rules)
  i18n:
    transliterate:
      rule:
        "ä": "ae"
        "ö": "oe"
        "ü": "ue"
        "ß": "ss"
        "é": "e"
        "è": "e"
        "à": "a"
        "ç": "c"

  cineseed:
    region:
      name: "Deutsch (Deutschland)"
      short: "DE-DE"
      script: latin
      order: 2

  faker:
    movie_store:
      genres:
        action: Action
        adventure: Abenteuer
        animation: Animation
        comedy: Komödie
        crime: Krimi
        documentary: Dokumentarfilm
        drama: Drama
        family: Familienfilm
        fantasy: Fantasy
        horror: Horror
        mystery: Mystery
        romance: Liebesfilm
        sci_fi: Science-Fiction
        thriller: Thriller
        war: Kriegsfilm
        western: Western

      kinds:
        movie: Film
        series: Serie

      # Patterns for reviewer and liker usernames ({first} {last} {f} {l} {nn} {yy}); names are
      # transliterated with i18n.transliterate.rule below.
      usernames: ["{first}.{last}", "{first}_{last}", "{first}{last}", "{f}{last}", "{first}{nn}", "{last}{yy}", "{f}.{last}", "{last}_{first}", "{first}_kino", "filmfreund_{first}", "{first}{last}{nn}", "kinofan{yy}"]

      runtime: "%{h} Std. %{m} Min."
      runtime_minutes: "%{m} Min."
      seasons: "Staffeln: %{count}"
      season_line: "Staffel %{n} · %{year} · %{episodes} Folgen"

      ratings:
        FSK 0: "Freigegeben ohne Altersbeschränkung"
        FSK 6: "Freigegeben ab 6 Jahren"
        FSK 12: "Freigegeben ab 12 Jahren"
        FSK 16: "Freigegeben ab 16 Jahren"
        FSK 18: "Keine Jugendfreigabe"
      rating_by_genre:
        movie:
          default: { FSK 12: 6, FSK 16: 3, FSK 6: 1 }
          family: { FSK 0: 5, FSK 6: 5 }
          animation: { FSK 0: 6, FSK 6: 4 }
          horror: { FSK 16: 6, FSK 18: 4 }
          war: { FSK 16: 7, FSK 12: 3 }
          crime: { FSK 16: 5, FSK 12: 5 }
          documentary: { FSK 0: 6, FSK 6: 3, FSK 12: 1 }
          comedy: { FSK 6: 4, FSK 12: 6 }
        series:
          default: { FSK 12: 6, FSK 16: 4 }
          family: { FSK 0: 6, FSK 6: 4 }
          animation: { FSK 0: 5, FSK 6: 5 }

      title:
        case: first
        articles:
          def:
            nom: { m: der, f: die, n: das, pl: die }
            gen: { m: des, f: der, n: des, pl: der }
        adjective_endings:
          regular:
            weak:
              nom: { m: e, f: e, n: e, pl: en }
              gen: { m: en, f: en, n: en, pl: en }
            strong:
              nom: { m: er, f: e, n: es, pl: e }
              gen: { m: en, f: er, n: en, pl: er }
        patterns:
          - { w: 9, base: true, t: "{art.def@x} {adj.weak@x} {noun:x}" }
          - { w: 4, base: true, t: "{adj.strong@x} {noun:x}" }
          - { w: 2, base: true, t: "{adj.strong@x} {nouns:x}" }
          - { w: 5, base: true, t: "{art.def@x} {noun:x} {art.def@y.gen} {noun:y.gen}" }
          - { w: 3, base: true, t: "{art.def@x} {noun:x} {art.def@y.gen} {adj.weak@y.gen} {noun:y.gen}" }
          - { w: 2, base: true, t: "{art.def@x} {noun:x} {art.def@y.gen} {nouns:y.gen}" }
          - { w: 3, base: true, t: "{art.def@x} {noun:x}" }
          - { w: 6, base: true, t: "{pick:single}" }
          - { w: 6, t: "{pick:phrase}" }
          - { w: 2, t: "{faker:Name.first_name} und {art.def@x} {noun:x}" }
          - { w: 4, t: "{pick:city_frame}" }
          - { w: 4, t: "{pick:prep_frame}" }
          - { w: 1, t: "{pick:number} {nouns:x}" }
          - { w: 4, t: "{base}: {pick:subtitle}" }
          - { w: 3, t: "{base} {pick:sequel}" }

        nouns:
          # masculine
