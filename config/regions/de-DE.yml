      taglines:
        action:
          - "Keine Regeln. Keine Rückendeckung. Keine zweite Chance."
          - "Die Uhr lief, sobald sie Nein gesagt hatte."
          - "Manche Missionen haben keinen Rückweg."
          - "Er wollte ein ruhiges Jahr. Die Welt hatte andere Pläne."
          - "Jede Straße aus der Stadt brennt bereits."
          - "Der letzte Auftrag ist immer der, der schiefgeht."
        adventure:
          - "Die Karte endet hier. Ihre Reise nicht."
          - "Jede Legende beginnt mit jemandem, der verrückt genug ist."
          - "Hinter dem letzten Fluss liegt das erste Wunder."
          - "Leichtes Gepäck. Niemandem trauen. Weitergehen."
          - "Die Welt ist größer als alle Geschichten über sie."
          - "Manche Schätze werden von mehr als Schlössern bewacht."
        animation:
          - "Kleiner Held. Riesiges Problem."
          - "Jeder Wald hat ein Geheimnis. Dieser hat hundert."
          - "Freundschaft war noch nie so flauschig."
          - "Ein Wunsch. Keine Gebrauchsanweisung."
          - "Die größten Abenteuer beginnen im eigenen Garten."
          - "Auch Legenden fangen klein an."
        comedy:
          - "Was soll schon schiefgehen? Alles. Zweimal."
          - "Sie hatten nur eine Aufgabe. Und haben sie nicht erledigt."
          - "Familie ist für immer. Leider."
          - "Ein perfekter Plan, ausgeführt von sehr unperfekten Menschen."
          - "Liebe ist geduldig. Liebe ist freundlich. Liebe ist sehr, sehr laut."
          - "Das Wochenende, das alle Leben ruinierte. Urkomisch."
        crime:
          - "In dieser Stadt schuldet jeder irgendwem etwas."
          - "Die Wahrheit hat ihren Preis. Sie zahlt ihn."
          - "Jedes Geständnis hat eine zweite Fassung."
          - "Verbrechen lohnt sich. Bis die Rechnung kommt."
          - "Eine Tasche voller Geld. Fünf Leute, die sie wollen."
          - "Manche Schulden zahlt man nicht mit Geld."
        documentary:
          - "Der Planet schreibt seine Geschichte noch immer selbst."
          - "Drei Jahre. Fünf Kontinente. Ein zerbrechliches Wunder."
          - "Die außergewöhnlichsten Reisen sind echt."
          - "Was geschieht, wenn niemand hinsieht."
          - "Ein Porträt der Menschen, die niemals aufgaben."
