# Footage sources for the trailer engine.
#
# `bin/rails footage:build` downloads every source (when the file is not already in footage/sources),
# splits it into shots with ffmpeg scene detection, normalizes each shot (24 fps, <= 960x540, H.264,
# no audio), extracts a still for posters, measures luma/saturation/warmth/motion and writes
# footage/manifest.json. Only openly licensed material is listed; see CREDITS.md.
#
# family  - visual world of the source. A trailer never mixes families, so a cartoon rabbit cannot
#           show up between two shots of a night city.
# tags    - genre keys (see config/trailer/genres.yml) and content hints. Mood tags (dark, bright,
#           warm, cool, mono, calm, dynamic) are added automatically from measurements.
# include - time ranges in seconds that may be used (titles and credits are left out).
# pre     - extra ffmpeg filters applied before normalizing (crop borders, 360 -> flat, ...).

defaults:
  scene_threshold: 0.30
  min_shot: 1.1
  max_shot: 3.0
  max_shots: 40

sources:
